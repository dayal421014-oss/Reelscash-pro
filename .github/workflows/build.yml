name: Build ReelsCash Pro APK and AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Java & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk unzip wget

      - name: Setup Flutter SDK
        run: |
          git clone https://github.com/flutter/flutter.git -b stable --depth 1 ~/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH

      - name: Build Project & Fix Gradle
        run: |
          flutter create --org com.reelscash --project-name pro --platforms android .
          mkdir -p android/app/src/main
          if [ -f "google-services (1).json" ]; then
            cp "google-services (1).json" android/app/google-services.json
          elif [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
          fi
          
          # Enable multidex and fix gradle config for release build
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          
          flutter pub get
          flutter build apk --release --verbose
          flutter build appbundle --release --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReelsCashPro-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ReelsCashPro-PlayStore-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          
