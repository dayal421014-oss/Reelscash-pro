name: Build ReelsCash Pro APK and AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Prepare Project and Firebase Config
        run: |
          flutter create --org com.reelscash --project-name pro --platforms android .
          mkdir -p android/app/src/main
          if [ -f "google-services (1).json" ]; then
            cp "google-services (1).json" android/app/google-services.json
          elif [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
          fi

      - name: Accept Android Licenses & Build Release
        run: |
          yes "y" | flutter doctor --android-licenses || true
          flutter pub get
          flutter build apk --release --no-pub
          flutter build appbundle --release --no-pub

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReelsCashPro-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: ReelsCashPro-PlayStore-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          
