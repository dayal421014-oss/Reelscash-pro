name: Build ReelsCash Pro APK and AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Project
        run: flutter create --org com.reelscash --project-name pro --platforms android .

      - name: Configure Firebase Google Services
        run: |
          python3 - << 'EOF'
          import glob, json, os, re, shutil
          matches = glob.glob('google-services*.json')
          pkg = 'com.reelscash.pro'
          if matches:
              shutil.copy(matches[0], 'android/app/google-services.json')
              gs = json.load(open('android/app/google-services.json'))
              pkg = gs['client'][0]['client_info']['android_client_info']['package_name']
          for path in ['android/settings.gradle.kts', 'android/settings.gradle']:
              if os.path.exists(path):
                  txt = open(path).read()
                  if 'google-services' not in txt:
                      txt = txt.replace('plugins {', 'plugins {\n    id("com.google.gms.google-services") version "4.4.2" apply false', 1)
                      open(path, 'w').write(txt)
          for path in ['android/app/build.gradle.kts', 'android/app/build.gradle']:
              if os.path.exists(path):
                  txt = open(path).read()
                  if 'google-services' not in txt:
                      txt = txt.replace('plugins {', 'plugins {\n    id("com.google.gms.google-services")', 1)
                  txt = re.sub(r'(namespace\s*=?\s*)"[^"]+"', rf'\1"{pkg}"', txt)
                  txt = re.sub(r'(applicationId\s*=?\s*)"[^"]+"', rf'\1"{pkg}"', txt)
                  txt = re.sub(r'minSdk\s*=\s*(flutter\.minSdkVersion|21)', 'minSdk = 23', txt)
                  txt = re.sub(r'minSdkVersion\s+(flutter\.minSdkVersion|21)', 'minSdkVersion 23', txt)
                  open(path, 'w').write(txt)
          manifest = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest):
              mtxt = open(manifest).read()
              if 'android.permission.INTERNET' not in mtxt:
                  mtxt = mtxt.replace('<application', '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
                  open(manifest, 'w').write(mtxt)
          EOF

      - name: Build APK and Play Store AAB
        run: |
          flutter pub get
          flutter build apk --release
          flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReelsCashPro-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: ReelsCashPro-PlayStore-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          
