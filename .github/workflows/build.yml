name: Build ReelsCash Pro APK and AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Create Flutter Project & Add Dependencies
        run: |
          flutter create --org com.reelscash --project-name pro --platforms android .
          mkdir -p android/app/src/main
          if [ -f "google-services (1).json" ]; then
            cp "google-services (1).json" android/app/google-services.json
          elif [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
          fi

      - name: Build APK and AAB
        run: |
          flutter pub get
          flutter build apk --release
          flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReelsCashPro-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ReelsCashPro-PlayStore-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          
